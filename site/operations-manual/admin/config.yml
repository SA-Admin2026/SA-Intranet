# Sveltia/Decap CMS configuration — the editable layer over the Git-backed Operations Manual.
# (Sveltia reads this Decap-format config unchanged.)
#
# Two backends:
#  - PRODUCTION: `github` — editors sign in with GitHub; each save is a commit to the
#    repo, which Cloudflare Pages rebuilds. `base_url` points at the sveltia-cms-auth
#    Cloudflare Worker that performs the GitHub OAuth token exchange (see docs/RUNBOOK.md).
#    Who can actually save = repo collaborators (GitHub enforces write at commit time).
#  - LOCAL DEMO: run `npm run cms` and open /admin — `local_backend` writes straight to
#    the working tree, no auth, for testing add/modify/delete without deploying.

backend:
  name: github
  repo: SA-Admin2026/SA-Operations-Manual
  branch: main
  # The sveltia-cms-auth Worker URL (GitHub OAuth). Set to the deployed Worker origin,
  # e.g. https://sveltia-cms-auth.<subdomain>.workers.dev  (see docs/RUNBOOK.md).
  base_url: https://REPLACE-WITH-YOUR-OAUTH-WORKER.workers.dev

# Enables the local proxy-server workflow for local editing (ignored in production).
local_backend: true

# Where uploaded images/files are written in the repo, and the URL they resolve to.
media_folder: public/attachments
public_folder: /attachments

# A tree-structured (nested) collection over the Starlight docs, so the editor shows
# the manual's real hierarchy and supports create/rename/delete of pages at any depth.
collections:
  - name: docs
    label: Operations Manual
    label_singular: Page
    folder: src/content/docs
    create: true
    delete: true
    extension: md
    format: frontmatter
    # Tree view + folder pages stored as index.md (matches the Starlight layout).
    nested:
      depth: 8
      summary: '{{title}}'
    meta:
      path:
        widget: string
        label: Path
        index_file: index
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      # Preserve migration provenance so saves don't strip it (optional, hidden).
      - { label: Confluence ID, name: confluence_id, widget: number, required: false }
      - { label: Source, name: source, widget: hidden, required: false }
